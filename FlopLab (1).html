H('Weapons');B('Hand / grab (0)',()=>setWeapon(-1));WP.forEach((w,i)=>B(w.n+' ('+(i+1)+')',()=>setWeapon(i)));H('Controls');P.insertAdjacentHTML('beforeend','<div style="line-height:1.6;color:#8d97ab">Click view: capture mouse<br>WASD move · Shift fast · Q/E down/up<br>LMB grab (gun: fire) · RMB push (gun: scope)<br>0 hand · 1 Draco · 2 G19 switch · 3 G19<br>4 Sniper · 5 Revolver · Tab menu<br>Wheel zoom · F shove · X x-ray · C/K autopsy<br>N dummy · B drum · U ramp · Y gravity<br>T slow-mo · I freeze · V vitals · R new dummies<br>Space/P pause · Tab menu · Esc release</div>');

// ---------- main loop ----------
resetScene();msg.textContent='Click the view to capture the mouse';
let last=performance.now(),fc=0,ft=0,fps=0;const hud=document.getElementById('hud');
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,1/30);last=now;
 if(!S.paused&&!S.frozen){const sd=dt*S.time/2;world.timestep=sd;
  for(let k=0;k<2;k++){for(const r of ragdolls)drive(r);
   if(grab){const t=grab.p.body.translation(),q=grab.p.body.rotation(),v=grab.p.body.linvel(),m=grab.p.body.mass();
    const a=grab.l.clone().applyQuaternion(Q1.set(q.x,q.y,q.z,q.w)).add(V2.set(t.x,t.y,t.z));
    const tg=camera.position.clone().addScaledVector(dir(),grab.dist);
    const f=tg.sub(a).multiplyScalar(100).sub(V.set(v.x,v.y,v.z).multiplyScalar(20));if(f.length()>400)f.setLength(400);f.multiplyScalar(m*sd);
    grab.p.body.applyImpulseAtPoint({x:f.x,y:f.y,z:f.z},{x:a.x,y:a.y,z:a.z},true)}
   world.step()}
  impacts(dt);for(const r of ragdolls)physio(r,dt*S.time)}
 for(const r of ragdolls)for(const p of r.list){const t=p.body.translation(),q=p.body.rotation();p.mesh.position.set(t.x,t.y,t.z);p.mesh.quaternion.set(q.x,q.y,q.z,q.w)}
 if(S.debug){const b=world.debugRender();dbg.geometry.setAttribute('position',new THREE.BufferAttribute(b.vertices,3))}
 gunTick(dt);updParticles(dt);
 if(auto&&sel){const c=sel.parts.chest.body.translation();T.lerp(V.set(c.x,c.y,c.z),1-Math.exp(-6*dt));const cp=Math.cos(op);
  camera.position.lerp(V2.set(T.x+od*cp*Math.sin(oy),T.y+od*Math.sin(op),T.z+od*cp*Math.cos(oy)),1-Math.exp(-10*dt));camera.lookAt(T)}
 else{camera.rotation.set(pitch,yaw,0);const sp=(keys.ShiftLeft?9:3)*dt,d=dir(),rt=new THREE.Vector3().crossVectors(d,Yv).normalize();
  if(keys.KeyW)camera.position.addScaledVector(d,sp);if(keys.KeyS)camera.position.addScaledVector(d,-sp);
  if(keys.KeyD)camera.position.addScaledVector(rt,sp);if(keys.KeyA)camera.position.addScaledVector(rt,-sp);
  if(keys.KeyE)camera.position.y+=sp;if(keys.KeyQ)camera.position.y-=sp}
 renderer.render(scene,camera);
 fc++;ft+=dt;if(ft>.5){fps=Math.round(fc/ft);fc=0;ft=0}
 hud.textContent=`FPS ${fps} · Ragdolls ${ragdolls.length} · ${auto?'Autopsy cam':'Free cam'} · ${S.paused?'PAUSED':'x'+S.time.toFixed(2)}${S.xray?' · X-RAY':''}${hudX()}`;
 msg.style.display=locked()?'none':'block'}
requestAnimationFrame(frame);
</script></body></html>
