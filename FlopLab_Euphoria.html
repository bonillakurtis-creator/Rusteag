let grid=new Map(),gridT=0,npcSeq=0,thinkOff=0,respT=0,rgC=[],rgT=0,crowdPan=0,AX=0,AZ=0;
const mkM=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const SHM=[0x3b6ea5,0xa53b3b,0x3ba57a,0xc9a227,0x7a3ba5,0xd8d8d8,0xe07b39,0x2f2f3a,0x5a8f3a,0xb0508f].map(mkM),
 PNM=[0x2b2f3a,0x4a3f2e,0x1d3a5a,0x555a62,0x1a1a1a].map(mkM),SKM=[0xf1c9a5,0xd9a37c,0xa9744f,0x7a4b2e,0xfad7b8].map(mkM);

const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>a+Math.random()*(b-a),wrapA=a=>a-Math.PI*2*Math.round(a/(Math.PI*2));

// ----- geometry helpers (oriented boxes in the XZ plane) -----
function inOb(x,z,m){for(const o of OBST){const ax=x-o.x,az=z-o.z,lx=ax*o.c-az*o.s,lz=ax*o.s+az*o.c;if(Math.abs(lx)<o.hx+m&&Math.abs(lz)<o.hz+m)return true}return false}
function segBox(o,x0,z0,x1,z1,m){const ax=x0-o.x,az=z0-o.z,bx=x1-o.x,bz=z1-o.z,p0=ax*o.c-az*o.s,q0=ax*o.s+az*o.c,p1=bx*o.c-bz*o.s,q1=bx*o.s+bz*o.c,hx=o.hx+m,hz=o.hz+m;let t0=0,t1=1;
 const dp=p1-p0,dq=q1-q0;
 if(Math.abs(dp)<1e-9){if(Math.abs(p0)>hx)return false}else{let a=(-hx-p0)/dp,b=(hx-p0)/dp;if(a>b){const t=a;a=b;b=t}t0=Math.max(t0,a);t1=Math.min(t1,b);if(t0>t1)return false}

 return true}
function pushOut(n,o,m){const ax=n.x-o.x,az=n.z-o.z,lx=ax*o.c-az*o.s,lz=ax*o.s+az*o.c,hx=o.hx+m,hz=o.hz+m;
 if(Math.abs(lx)>=hx||Math.abs(lz)>=hz)return false;
 const px=hx-Math.abs(lx),pz=hz-Math.abs(lz);let nx=0,nz=0;if(px<pz)nx=lx<0?-px:px;else nz=lz<0?-pz:pz;
 n.x+=nx*o.c+nz*o.s;n.z+=-nx*o.s+nz*o.c;return true}
function avoidBox(o,x,z,R,bx,bz){const ax=x-o.x,az=z-o.z,lx=ax*o.c-az*o.s,lz=ax*o.s+az*o.c,cx=Math.max(-o.hx,Math.min(o.hx,lx)),cz=Math.max(-o.hz,Math.min(o.hz,lz));

 if(d<1e-4){const px=o.hx-Math.abs(lx),pz=o.hz-Math.abs(lz);if(px<pz){ex=lx<0?-1:1;ez=0}else{ex=0;ez=lz<0?-1:1}s=1.5}else{ex/=d;ez/=d;s=(R-d)/R}
 const wx=ex*o.c+ez*o.s,wz=-ex*o.s+ez*o.c;let tx=-wz,tz=wx;if(tx*bx+tz*bz<0){tx=-tx;tz=-tz}
 AX+=wx*s*2+tx*s*1.6;AZ+=wz*s*2+tz*s*1.6}
function avoidC(cx,cz,R,x,z,bx,bz){const ex=x-cx,ez=z-cz,d=Math.hypot(ex,ez);if(d>=R||d<1e-4)return;const s=(R-d)/R,nx=ex/d,nz=ez/d;let tx=-nz,tz=nx;if(tx*bx+tz*bz<0){tx=-tx;tz=-tz}AX+=nx*s*2+tx*s*1.4;AZ+=nz*s*2+tz*s*1.4}

// ----- cheap path planning: line-of-sight test + detour via inflated obstacle corner -----
function route(n){n.wp=null;const x0=n.x,z0=n.z,x1=n.tx,z1=n.tz;
 for(const o of OBST){if(!segBox(o,x0,z0,x1,z1,.55))continue;let best=null,bd=1e9;
  for(let k=0;k<4;k++){const lx=(k&1?1:-1)*(o.hx+.9),lz=(k&2?1:-1)*(o.hz+.9),wx=o.x+lx*o.c+lz*o.s,wz=o.z-lx*o.s+lz*o.c;
   if(Math.abs(wx)>ARENA||Math.abs(wz)>ARENA||inOb(wx,wz,.5))continue;
   const d=Math.hypot(wx-x0,wz-z0)+Math.hypot(x1-wx,z1-wz);if(d<bd){bd=d;best=[wx,wz]}}
  if(best)n.wp={x:best[0],z:best[1]};return}}
function pickTarget(n){for(let t=0;t<6;t++){const a=Math.random()*6.283,r=rnd(4,14),x=Math.max(-ARENA+1,Math.min(ARENA-1,n.x+Math.cos(a)*r)),z=Math.max(-ARENA+1,Math.min(ARENA-1,n.z+Math.sin(a)*r));
  if(inOb(x,z,.9))continue;n.tx=x;n.tz=z;n.tt=rnd(12,25);route(n);return}

// ----- NPC creation -----
function makeNpc(x,z){const g=new THREE.Group(),sh=pick(SHM),pn=pick(PNM),hm=pick(SKM).clone(),ms=[];
 const mk=(geo,mat,sx,sy,sz,px,py,pz,par)=>{const m=new THREE.Mesh(geo,mat);m.scale.set(sx,sy,sz);m.position.set(px,py,pz);m.castShadow=true;par.add(m);ms.push(m);return m};
 const body=new THREE.Group();body.position.y=.92;g.add(body);
 mk(G.box,sh,.36,.52,.2,0,.27,0,body);
 const head=new THREE.Group();head.position.y=.66;body.add(head);mk(G.sph,hm,.115,.13,.12,0,.05,0,head);
 const arm=s=>{const pv=new THREE.Group();pv.position.set(.24*s,.5,0);body.add(pv);mk(G.box,sh,.085,.5,.09,0,-.24,0,pv);return pv},
  leg=s=>{const pv=new THREE.Group();pv.position.set(.1*s,0,0);body.add(pv);mk(G.box,pn,.12,.88,.13,0,-.44,0,pv);return pv};
 const aL=arm(1),aR=arm(-1),lL=leg(1),lR=leg(-1);
 const xs=[],xb=(par,geo,...a)=>{const m=bone(par,geo,...a);m.visible=false;xs.push(m);return m};   // x-ray skeleton
 xb(head,G.sph,0,.06,0,.085,.095,.09);xb(head,G.box,0,-.005,.04,.06,.025,.05);xb(head,G.sph,.03,.075,.075,.017,.017,.017,0,dkN);xb(head,G.sph,-.03,.075,.075,.017,.017,.017,0,dkN);
 xb(body,G.cyl,0,.25,-.03,.02,.5,.02);for(let i=0;i<4;i++)xb(body,G.tor,0,.2+i*.07,0,.34,.22,.2,Math.PI/2);xb(body,G.box,0,.02,0,.24,.08,.08);
 xb(aL,G.cyl,0,-.24,0,.018,.5,.018);xb(aR,G.cyl,0,-.24,0,.018,.5,.018);xb(lL,G.cyl,0,-.44,0,.022,.88,.022);xb(lR,G.cyl,0,-.44,0,.022,.88,.022);
 const a=Math.random()*6.283;
 const n={g,body,head,aL,aR,lL,lR,hm,sh,ms,xs,x,z,h:Math.random()*6.283,vx:0,vz:0,sp:0,dx:Math.sin(a),dz:Math.cos(a),dsp:0,panic:0,fear:rnd(.7,1.4),spd:rnd(.85,1.2),react:'run',pan:false,rt:0,zt:0,zs:0,
  fx:Math.sin(a),fz:Math.cos(a),dT:99,tx:x,tz:z,wp:null,tt:0,idle:rnd(0,3),nt:Math.random()*.3,ta:0,sx:x,sz:z,sk:0,stuck:0,ph:rnd(0,6.28),off:rnd(0,6.28),cr:0,st:'idle',shd:true,d2:0};
 g.position.set(x,0,z);scene.add(g);
 // Every crowd character now owns a real articulated Rapier ragdoll from spawn.
 // Keep the existing crowd brain for navigation, but let physics own its position.
 const previous=sel;
 n.r=spawn(x,.04,z,a);n.r.npc=n;n.r.mat.color.copy(sh.color);n.r.sf=1;

function applyNpcX(n){for(const m of n.xs)m.visible=S.xray;n.hm.transparent=S.xray;n.hm.opacity=S.xray?.2:1;n.hm.depthWrite=!S.xray;n.hm.needsUpdate=true}
function setXrayNpc(){for(const m of NMATS){m.transparent=S.xray;m.opacity=S.xray?.2:1;m.depthWrite=!S.xray;m.needsUpdate=true}for(const n of NP)applyNpcX(n)}
function removeNpc(n,preserveR=false){const i=NP.indexOf(n);if(i<0)return;scene.remove(n.g);n.hm.dispose();NP.splice(i,1);
 if(!preserveR&&n.r&&ragdolls.includes(n.r))del(n.r)}

// ----- crowd size / density management -----
function crowdTarget(){return S.crowdOn?Math.max(0,Math.min(S.crowdSize,S.maxNpc,150)):0}
function spawnPt(far){const cnt=Math.max(1,crowdTarget()),rad=Math.min(ARENA-1.5,Math.sqrt(cnt*100/Math.max(.1,S.density)/Math.PI));
 for(let t=0;t<30;t++){const a=Math.random()*6.283,r=rad*Math.sqrt(Math.random()),x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(inOb(x,z,.8))continue;if(far&&Math.hypot(x-camera.position.x,z-camera.position.z)<14)continue;
  let ok=true;for(const m of NP)if((m.x-x)*(m.x-x)+(m.z-z)*(m.z-z)<1){ok=false;break}
  if(ok)for(const r2 of ragdolls){const q=r2.parts.pelvis.body.translation();if((q.x-x)*(q.x-x)+(q.z-z)*(q.z-z)<2){ok=false;break}}
  if(ok)return[x,z]}

function syncCrowd(){const t=crowdTarget();while(NP.length>t)removeNpc(NP[NP.length-1]);while(NP.length<t){const p=spawnPt(false);if(!p)break;makeNpc(p[0],p[1])}}
function rebuildCrowd(){while(NP.length)removeNpc(NP[0]);syncCrowd()}
let rebT=0;function rebuildSoon(){clearTimeout(rebT);rebT=setTimeout(rebuildCrowd,250)}

// ----- danger events: gunshots, explosions, impacts, deaths -----
function noise(x,z,loud,rad){if(!NP.length||loud<=0)return;const sn=S.panicSens;
 for(const n of NP){const dx=n.x-x,dz=n.z-z,d2=dx*dx+dz*dz;if(d2>rad*rad)continue;const d=Math.sqrt(d2),f=1-d/rad,g=loud*f*(.4+.6*f)*sn*n.fear*1.2;if(g<.01)continue;
  n.panic=Math.min(1,n.panic+g);n.dT=0;if(d>.3){n.fx=dx/d;n.fz=dz/d}else{const a=Math.random()*6.283;n.fx=Math.sin(a);n.fz=Math.cos(a)}
  n.nt=Math.min(n.nt,rnd(.05,.25))}}   // randomised reaction delay
function scareCrowd(x,z,loud){noise(x,z,loud,60);}
function calmCrowd(){for(const n of NP){n.panic=Math.min(n.panic,.05);n.dT=99;n.pan=false;n.rt=0}}
function loudBang(){const q=aimPoint();noise(q.x,q.z,1.1,55);emit(q.x,q.y+.1,q.z,30,1,.9,.5,6);flash.position.set(q.x,q.y+1,q.z);flash.intensity=30}

// ----- per-NPC decision making (runs on a distance-based schedule, not every frame) -----
function think(n,dt){const px=n.x,pz=n.z;n.dT+=dt;
 let sx=0,sz=0,hot=0;const cx=Math.floor(px/CS),cz=Math.floor(pz/CS);
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=grid.get(ck2(cx+i,cz+j));if(!a)continue;
  for(let q=0;q<a.length;q++){const m=a[q];if(m===n)continue;const ex=px-m.x,ez=pz-m.z,d2=ex*ex+ez*ez;if(d2>16||d2<1e-6)continue;const d=Math.sqrt(d2);
   if(d<1.1){const f=(1.1-d)/d*1.6;sx+=ex*f;sz+=ez*f}                       // personal space
   if(m.panic>n.panic+.02&&m.panic>.25){const w=1-d/4;                         // panic spreads to nearby NPCs
    n.panic=Math.min(1,n.panic+(m.panic-n.panic)*w*dt*1.2*S.panicSpread*n.fear);
    const k=Math.min(1,w*.6);n.fx+=(m.fx-n.fx)*k;n.fz+=(m.fz-n.fz)*k;hot++}}}
 const fl=Math.hypot(n.fx,n.fz)||1;n.fx/=fl;n.fz/=fl;
 if(n.dT>2.2&&hot==0)n.panic=Math.max(0,n.panic-dt*(.07+.06*(1-n.panic)));      // gradual calming
 const p=n.panic;
 if(p>=.4&&!n.pan){n.pan=true;const r=Math.random();n.react=r<.5?'run':r<.68?'zigzag':r<.82?'freeze':'crouch';
  if(n.react=='freeze')n.rt=rnd(.8,2.2);else if(n.react=='crouch')n.rt=rnd(1.5,3.5)}
 else if(p<.12&&n.pan){n.pan=false;n.react='run';n.rt=0}
 if(n.rt>0){n.rt-=dt;if(p>.85)n.rt-=dt}
 let bx=0,bz=0,sp=0,st='walk';const base=1.25*n.spd*S.npcSpeed;
 if(p>=.4){
  if(n.rt>0){st=n.react=='crouch'?'crouch':'freeze'}
  else{st=p>=.75?'terror':'run';let fx=n.fx,fz=n.fz;
   if(n.react=='zigzag'||p>=.75){n.zt-=dt;if(n.zt<=0){n.zt=rnd(.5,1.3);n.zs=(Math.random()<.5?-1:1)*rnd(.3,.9)}const c=Math.cos(n.zs),s=Math.sin(n.zs),tx=fx*c-fz*s,tz=fx*s+fz*c;fx=tx;fz=tz}
   bx=fx;bz=fz;sp=(3.3+p*2)*n.spd*S.npcSpeed}

  else{n.tt-=dt;const gx=n.wp?n.wp.x:n.tx,gz=n.wp?n.wp.z:n.tz,ex=gx-px,ez=gz-pz,d=Math.hypot(ex,ez);
   if(d<(n.wp?.7:1)){if(n.wp){n.wp=null;route(n)}else{if(Math.random()<.4)n.idle=rnd(1.5,5);pickTarget(n)}}
   else{bx=ex/d;bz=ez/d;sp=base*(d<2?.7:1)}
   if(n.tt<=0)pickTarget(n)}}
 // steering: obstacles, walls, drums, ragdolls, neighbours
 AX=sx;AZ=sz;
 if(st!='freeze'&&st!='crouch'&&st!='idle'){
  const L=1+sp*.35;
  for(const o of OBST){if(Math.abs(o.x-px)>o.R+L+1.5||Math.abs(o.z-pz)>o.R+L+1.5)continue;avoidBox(o,px+bx*L,pz+bz*L,1,bx,bz);avoidBox(o,px,pz,1,bx,bz)}
  for(const d of drums){const q=d.m.position;if(Math.abs(q.x-px)<3&&Math.abs(q.z-pz)<3)avoidC(q.x,q.z,1.1,px,pz,bx,bz)}
  for(let i=0;i<rgC.length;i+=2)if(Math.abs(rgC[i]-px)<2.5&&Math.abs(rgC[i+1]-pz)<2.5)avoidC(rgC[i],rgC[i+1],1.0,px,pz,bx,bz);
  const wm=2.2;if(px>ARENA-wm)AX-=(px-ARENA+wm)/wm*2.5;if(px<-ARENA+wm)AX+=(-ARENA+wm-px)/wm*2.5;if(pz>ARENA-wm)AZ-=(pz-ARENA+wm)/wm*2.5;if(pz<-ARENA+wm)AZ+=(-ARENA+wm-pz)/wm*2.5;

   else{n.wp=null;pickTarget(n)}
   if(n.stuck>2){for(const o of OBST)pushOut(n,o,.7);n.stuck=0}}
  else n.stuck=0;
  n.sx=px;n.sz=pz;n.sk=0}
 n.hm.emissive.setRGB(S.npcTint?Math.min(1,p*1.1)*.9:0,0,0);
 const near=n.d2<784;if(near!==n.shd){n.shd=near;for(const m of n.ms)m.castShadow=near}}

// ----- procedural animation: walk, run, alert, freeze, crouch, terror flail -----
function animNpc(n,dt){const t=performance.now()*.001+n.off,p=n.panic,sp=n.sp,st=n.st,k=Math.min(1,dt*12);
 n.ph+=dt*(sp*2.7+(sp>.2?1.5:0));
 const sw=Math.sin(n.ph),run=sp>2.6,amp=sp<.1?0:Math.min(1.2,.3+sp*.19);

 let la=Math.atan2(-n.fx,-n.fz)-n.h;la=Math.max(-1.1,Math.min(1.1,wrapA(la)));

 if(run){a1=a1*.7-.8;a2=a2*.7-.8}
 if(st=='terror'){a1=-2.7+Math.sin(t*15)*.6;a2=-2.7+Math.sin(t*15+2)*.6;z1=.45+Math.sin(t*11)*.3;z2=-.45-Math.sin(t*11+1)*.3;hy=Math.sin(t*9)*.55;by+=Math.abs(sw)*.05;lean*=.7}
 else if(st=='run')hy=Math.sin(t*3)*.55*p;
 else if(st=='alert'){hy=la;a1-=.4;a2-=.4}
 else if(st=='freeze'){hy=la;a1=a2=-1.3;z1=.35;z2=-.35;l1=l2=0;bx=Math.sin(t*45)*.012}
 else if(st=='crouch'){a1=a2=-2.7;z1=.5;z2=-.5;hy=0}
 if(cr>.01){by-=.4*cr;l1=l1*(1-cr)-1.15*cr;l2=l2*(1-cr)-1.15*cr;lean+=.65*cr}

 const bd=n.body;bd.position.y+=(by-bd.position.y)*k;bd.position.x+=(bx-bd.position.x)*k;bd.rotation.x+=(lean-bd.rotation.x)*k;
 n.lL.rotation.x+=(l1-n.lL.rotation.x)*k;n.lR.rotation.x+=(l2-n.lR.rotation.x)*k;
 n.aL.rotation.x+=(a1-n.aL.rotation.x)*k;n.aR.rotation.x+=(a2-n.aR.rotation.x)*k;
 n.aL.rotation.z+=(z1-n.aL.rotation.z)*k;n.aR.rotation.z+=(z2-n.aR.rotation.z)*k;n.head.rotation.y+=(hy-n.head.rotation.y)*k}

// ----- crowd update: cheap per-frame integration, scheduled thinking -----
function updCrowd(dt){
 if(!NP.length&&!(S.respawn&&crowdTarget()>0)){crowdPan=0;return}
 const cp=camera.position;gridT-=dt;
 if(gridT<=0){gridT=.1;grid.clear();for(const n of NP){const k=ck(n.x,n.z);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(n)}}
 rgT-=dt;if(rgT<=0){rgT=.15;rgC.length=0;for(const r of ragdolls){const t=r.parts.pelvis.body.translation();rgC.push(t.x,t.z)}}
 let budget=30,pcnt=0;const cnt=NP.length;
 for(let i=0;i<cnt;i++){const n=NP[(i+thinkOff)%cnt];
  if(n.r&&ragdolls.includes(n.r)){const pp=n.r.parts.pelvis.body.translation();n.x=pp.x;n.z=pp.z}
  const ddx=n.x-cp.x,ddz=n.z-cp.z,d2=ddx*ddx+ddz*ddz;n.d2=d2;n.ta+=dt;n.nt-=dt;
  if(n.nt<=0&&budget>0){budget--;think(n,n.ta);n.ta=0;n.nt=(d2<196?.1:d2<900?.22:d2<2500?.5:.9)*(n.panic>.4?.7:1)}
  // The pelvis is authoritative: AI supplies a desired velocity, Rapier supplies motion.
  const k=Math.min(1,dt*(n.dsp>n.sp?4.5:7));

// ----- Euphoria-inspired NPC muscle controller -----
// A lightweight active-ragdoll motor: balance comes from the shared joint drive;
// crowd AI steers the pelvis while gait muscles add alternating limb motion.
function driveNpc(n,dt){

 const pelvis=r.parts.pelvis.body,chest=r.parts.chest.body;

 const tx=n.vx, tz=n.vz;
 let ax=(tx-pv.x)*7.5*S.npcBalance,az=(tz-pv.z)*7.5*S.npcBalance;
 const al=Math.hypot(ax,az);if(al>32) {ax*=32/al;az*=32/al}

 }
 // Alternating hip/arm swing gives the controller a gait target while joints stay physical.
 n.ph+=dt*(2.2+Math.min(5,speed)*1.5);
 const gait=Math.min(1,speed/1.4)*S.npcMuscle;
 const swing=Math.sin(n.ph)*gait*2.2*mass*.035;
 r.parts.thighL.body.addTorque({x:swing,y:0,z:0},true);
 r.parts.thighR.body.addTorque({x:-swing,y:0,z:0},true);
 r.parts.uarmL.body.addTorque({x:-swing*.55,y:0,z:0},true);
 r.parts.uarmR.body.addTorque({x:swing*.55,y:0,z:0},true);
 const knee=Math.max(0,Math.sin(n.ph))*gait*mass*.018;
 r.parts.shinL.body.addTorque({x:knee,y:0,z:0},true);
 r.parts.shinR.body.addTorque({x:Math.max(0,-Math.sin(n.ph))*gait*mass*.018,y:0,z:0},true);

H('Controls');P.insertAdjacentHTML('beforeend','<div style="line-height:1.6;color:#8d97ab">Click view: capture mouse<br>WASD walk · Shift run · G walk/fly · Q/E (fly)<br>LMB grab (gun: fire) · RMB push (gun: scope)<br>0 hand · 1 Draco · 2 G19 switch · 3 G19<br>4 Sniper · 5 Revolver · Tab menu<br>Wheel zoom · F shove · X x-ray · C/K autopsy<br>N dummy · B drum · U ramp · Y gravity<br>T slow-mo · I freeze · V vitals · R new dummies<br>H helmet · J damaged head · L loud bang<br>Hand on a crowd NPC: LMB grab / RMB push<br>Space/P pause · Tab menu · Esc release</div>');

// ---------- main loop ----------
resetScene();msg.textContent='Click the view to capture the mouse';
let last=performance.now(),fc=0,ft=0,fps=0,acc=0;const hud=document.getElementById('hud');
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,1/30);last=now;
 const run=!S.paused&&!S.frozen;let sdt=0;
 if(run){
  if(pend.length){for(const a of pend)if(ragdolls.includes(a[0].r))shot(...a);pend.length=0}
  // fixed-timestep physics: identical dt every step, slow-mo only changes how much sim time accrues
  const h0=1/S.physHz;world.timestep=h0;acc=Math.min(acc+dt*S.time,h0*8);sdt=dt*S.time;let n=0;
  while(acc>=h0&&n<8){for(const r of ragdolls)drive(r);
   for(const npc of NP)driveNpc(npc,h0);
   if(grab){const t=grab.p.body.translation(),q=grab.p.body.rotation(),v=grab.p.body.linvel(),m=grab.p.body.mass();
    const a=grab.l.clone().applyQuaternion(Q1.set(q.x,q.y,q.z,q.w)).add(V2.set(t.x,t.y,t.z));
    const tg=camera.position.clone().addScaledVector(dir(),grab.dist);
    const f=tg.sub(a).multiplyScalar(100).sub(V.set(v.x,v.y,v.z).multiplyScalar(20));if(f.length()>400)f.setLength(400);f.multiplyScalar(m*h0);
    grab.p.body.applyImpulseAtPoint({x:f.x,y:f.y,z:f.z},{x:a.x,y:a.y,z:a.z},true)}
   world.step();acc-=h0;n++}
  impacts(sdt);for(const r of ragdolls)physio(r,sdt);updCrowd(sdt)}
 for(const r of ragdolls)for(const p of r.list){const t=p.body.translation(),q=p.body.rotation();p.mesh.position.set(t.x,t.y,t.z);p.mesh.quaternion.set(q.x,q.y,q.z,q.w)}
 for(const h of looseH){const t=h.body.translation(),q=h.body.rotation();h.g.position.set(t.x,t.y,t.z);h.g.quaternion.set(q.x,q.y,q.z,q.w)}
 updVis(dt);
 if(S.debug){const b=world.debugRender();dbg.geometry.setAttribute('position',new THREE.BufferAttribute(b.vertices,3))}
 gunTick(dt);if(sdt>0){updParticles(sdt);updBlood(sdt)}
 if(auto&&sel){const c=sel.parts.chest.body.translation();T.lerp(V.set(c.x,c.y,c.z),1-Math.exp(-6*dt));const cp=Math.cos(op);
  camera.position.lerp(V2.set(T.x+od*cp*Math.sin(oy),T.y+od*Math.sin(op),T.z+od*cp*Math.cos(oy)),1-Math.exp(-10*dt));camera.lookAt(T)}
 else{camera.rotation.set(pitch,yaw,0);const sp=(keys.ShiftLeft?(S.walk?6:9):3)*dt,d=dir(),rt=new THREE.Vector3().crossVectors(d,Yv).normalize();
  if(S.walk){   // walk on the ground: eye height 1.7 m, movement stays horizontal, blocked by obstacles and walls
   const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);let mx=0,mz=0;
   if(keys.KeyW){mx+=fx;mz+=fz}if(keys.KeyS){mx-=fx;mz-=fz}if(keys.KeyD){mx+=rx;mz+=rz}if(keys.KeyA){mx-=rx;mz-=rz}
   const ml=Math.hypot(mx,mz)||1,wk={x:camera.position.x+mx/ml*sp,z:camera.position.z+mz/ml*sp};
   for(const o of OBST)pushOut(wk,o,.35);
   camera.position.x=Math.max(-23.8,Math.min(23.8,wk.x));camera.position.z=Math.max(-23.8,Math.min(23.8,wk.z));camera.position.y+=(1.7-camera.position.y)*Math.min(1,dt*10)}
  else{
  if(keys.KeyW)camera.position.addScaledVector(d,sp);if(keys.KeyS)camera.position.addScaledVector(d,-sp);
  if(keys.KeyD)camera.position.addScaledVector(rt,sp);if(keys.KeyA)camera.position.addScaledVector(rt,-sp);
  if(keys.KeyE)camera.position.y+=sp;if(keys.KeyQ)camera.position.y-=sp}}
 renderer.render(scene,camera);
 if(cur>=0&&gun.visible){if(gcam.aspect!==camera.aspect){gcam.aspect=camera.aspect;gcam.updateProjectionMatrix()}renderer.autoClear=false;renderer.clearDepth();renderer.render(gunScene,gcam);renderer.autoClear=true}
 fc++;ft+=dt;if(ft>.5){fps=Math.round(fc/ft);fc=0;ft=0}
 hud.textContent=`FPS ${fps} · Ragdolls ${ragdolls.length} · NPC ${NP.length}${crowdPan?' ('+crowdPan+' panicking)':''} · ${auto?'Autopsy cam':'Free cam'} · ${S.paused?'PAUSED':'x'+S.time.toFixed(2)} · ${S.physHz}Hz${S.xray?' · X-RAY':''}${hudX()}`;
 msg.style.display=locked()?'none':'block'}
requestAnimationFrame(frame);
</script></body></html>
